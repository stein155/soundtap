# zizmor (make lint-actions). Every action, GitHub's own included, is pinned by full commit
# SHA: a tag can be moved to other code, a commit cannot.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # zizmor proposes `$/` for the repository's own actions and workflows; the pinned
  # actionlint does not know that spelling, and `./` means the same.
  self-repository:
    disable: true
  # release.yml calls sign.yml for an alpha. GitHub hands a called workflow no secret, its own
  # environment's included, unless the caller inherits them; only sign.yml's job, in the
  # release environment, reads one (ADR 0035).
  secrets-inherit:
    ignore:
      - release.yml

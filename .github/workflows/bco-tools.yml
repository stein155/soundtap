name: BCO tools

# bcoflash for the speaker (ARMv7, static), as the artifact tool-bcoflash of the run
# (ADR 0011). Builds only; writes nothing.
on:
  workflow_dispatch:
  push:
    branches: ['feat/st20-*']
    paths:
      - .github/workflows/bco-tools.yml
      - app/cmd/bcoflash/**
      - app/internal/bco/**

permissions:
  contents: read

jobs:
  build:
    # Go cross-compiles, so any hosted runner will do.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod
      - name: Build bcoflash
        working-directory: app
        run: |
          test -z "$(gofmt -l ./cmd/bcoflash)"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags=-s -o ../dist/bcoflash ./cmd/bcoflash
          sha256sum ../dist/bcoflash
      # The tool is this workflow's product: a failed upload fails the run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-bcoflash
          retention-days: 90
          if-no-files-found: error
          path: dist/bcoflash

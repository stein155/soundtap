name: Buildroot bootloaders

# The Buildroot package host-soundtap-bootloaders against os/bootloader, the reference:
# for each of the three STU bootloader builds, the saved .config must be the one the mainline script
# produces, and build-variant.sh must give the same bytes. Builds only; writes nothing.
# Not on pull requests: it takes 23-96 minutes, over the CI budget, and was cancelled more
# often than it finished there. It runs after a bootloader change lands on main, so a drift
# between the two bootloader builds is caught the same day instead of by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "os/bootloader/**"
      - "os/package/soundtap-bootloaders/**"
      - ".github/workflows/buildroot-bootloaders.yml"

permissions:
  contents: read

concurrency:
  group: buildroot-bootloaders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  match-mainline:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mainline and Buildroot bootloaders are identical
        run: JOBS=4 sh os/package/soundtap-bootloaders/check-mainline.sh

  # The package itself, with its pinned Debian toolchain, as far as the bootloaders and the
  # host tools they need (not a profile build: no target toolchain, no target packages). The
  # job above proves the recipe; this one proves Buildroot runs it to the same bytes.
  # On both architectures: the sums below were measured on arm64, and Build makes the
  # package that ships on x64, each host with its own pinned Debian cross compiler.
  buildroot-package:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - run: make builder

      - name: Build host-soundtap-bootloaders for both profiles
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env FORCE_UNSAFE_CONFIGURE=1 \
            --volume "$PWD:/work" --workdir /work soundtap-builder:2026.05.1 sh -euc '
            o=/work/output/bootloaders-ci
            m="make -C buildroot O=$o BR2_EXTERNAL=/work/os BR2_DL_DIR=/work/dl"
            $m soundtap_defconfig
            # One package, no ccache; the profile already selects both variant sets.
            sed -i "s/^BR2_CCACHE=y/# BR2_CCACHE is not set/" $o/.config
            $m olddefconfig
            $m host-soundtap-bootloaders-dirclean host-soundtap-bootloaders'
          cd output/bootloaders-ci/images
          # The mainline images these must equal.
          # Print the actual sums first, so a re-pin can be read off a failed run.
          sha256sum st20-spl/* wla-spl/MLO wla-uboot/u-boot.img
          sha256sum -c <<'SUMS'
          c35444c745384cb15d6d7a219b44aa1ba9d17ab98a8dabc3dbff1e80f2d4a60f  st20-spl/MLO
          336af97d96707ddeaced7dbf3f19016d470deeb61354a9b3d269a4e5b7d50ada  st20-spl/u-boot-spl.bin
          d29c8f20524a33079077ebd9da09cf1974d6c2e40f79124495a0bd4e97549838  st20-spl/uImage-spl-sram
          1e183c2b5a6dd05dc23a0fe2f8d0f09ecf6b2765b9a3bd4a47653c6288ae6ea1  wla-spl/MLO
          6c8d875e5a1c24d6877df3883f5744cd3cbb971eb7c5e5ff8e9f1c92048d306b  wla-uboot/u-boot.img
          SUMS
      # The rescue chain (docs/hardware/st20/rom-usb-recovery.md) serves these bytes.
      # One copy: the sums above hold both legs to the same bytes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: bootloaders
          retention-days: 90
          if-no-files-found: error
          path: output/bootloaders-ci/images/

name: Docs

# Builds the documentation site from docs/ (and the root pages docs/tools/root_pages.py adds)
# and publishes it to GitHub Pages, the browser installer (docs/installer/) at /installer/.
# The repository's Pages source must be "GitHub Actions" (RELEASING.md, "Repository settings").
# Pull requests only build it (strict, so a broken link fails the check).
on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml, README.md, CHANGELOG.md, RUNBOOK.md, SECURITY.md]
  pull_request:
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml, README.md, CHANGELOG.md, RUNBOOK.md, SECURITY.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # A newer pull request build replaces an older one; a Pages deployment is never cut
  # off halfway, the next one waits for it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Hosted runners and Pages need the public repository.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the site
        run: >-
          docker run --rm -v "$PWD:/docs" -w /docs
          squidfunk/mkdocs-material:9.7.7@sha256:51b87149d227691486b5f08993d28c65ca7e4990010664b697265b8e6fcd5287
          build --strict -d site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Release

# Two release lanes, named and numbered per ADR 0035:
#   os:  SoundTap Core, the universal STU, tagged os-vX.Y.Z from os/VERSION. It publishes the
#        package build.yml built for the commit being released, byte for byte; it never
#        rebuilds. Run build.yml on that commit first.
#   app: the SoundTap app, soundtapd with the UI embedded, tagged app-vX.Y.Z from
#        app/VERSION. Installed through the speaker's app upload (/api/soundtapd), which
#        refuses it on a Core whose /etc/soundtap/os-api is below what the app needs.
# The version is never typed in: it is the VERSION file of the commit, raised in a PR.
# X.Y.Z-alpha.N is an alpha: its draft is a GitHub prerelease, and everything else here
# (CI, the candidate, production, checksums, sources, SBOM) is required as for a release.
#
# Signing is offline (ADR 0035): this workflow never sees the release key. It publishes a
# draft with the asset and its digest; the maintainer runs tools/release/sign-release.sh <tag>,
# which signs it locally and uploads <asset>.sig, installs it on their own speakers, and then
# makes the release public with sign-release.sh --publish <tag>.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: What to release
        required: true
        type: choice
        options: [os, app]
        default: os

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Neither lane publishes a commit CI has not passed on (ADR 0035): the app lane builds
  # straight from the commit, and build.yml, which the Core lane publishes, runs no tests.
  ci-passed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions to find the CI run, contents for the checkout below.
    permissions:
      actions: read
      contents: read
    steps:
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only main is released: a dispatch from a branch would sign that branch's code.
          test "$GITHUB_REF" = refs/heads/main || { echo "release only from main, not $GITHUB_REF" >&2; exit 1; }
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w build-stu.yml --commit "$GITHUB_SHA" \
            --branch main --status success --json event,databaseId \
            -q '[.[] | select(.event == "push" or .event == "workflow_dispatch")] | length')
          test "$n" -gt 0 || { echo "CI (build-stu.yml) has not passed on $GITHUB_SHA" >&2; exit 1; }
      # Both lanes ship this commit's web UI; the README must show that UI (RELEASING.md, Steps).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: README screenshots were made from this commit's web UI
        run: python3 tools/release/screenshots.py check "$GITHUB_SHA"

  release:
    needs: ci-passed
    if: inputs.lane == 'os'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Creates the draft and fetches Build's candidate artifact.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Publish the candidate built from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d ' \n' < os/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[1-9][0-9]*)?$ ]] ||
            { echo "os/VERSION must be X.Y.Z or X.Y.Z-alpha.N" >&2; exit 2; }
          tag=os-v$version stu=SoundTap-Core-$version.stu
          pre=()
          if [[ "$version" == *-alpha.* ]]; then pre=(--prerelease); fi
          ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null ||
            { echo "$tag exists: raise os/VERSION first" >&2; exit 1; }
          python3 tools/release/changelog.py check "$tag"
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w build.yml --commit "$GITHUB_SHA" \
            --status success -L 1 --json databaseId -q '.[0].databaseId')
          test -n "$run" || { echo "no successful Build run on $GITHUB_SHA: run Build first" >&2; exit 1; }
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n candidate -D dist
          built=$(cat dist/commit)
          test "$built" = "$GITHUB_SHA" || {
            echo "candidate was built from $built, not $GITHUB_SHA: run Build first" >&2
            exit 1
          }
          # Only the production profile is released (ADR 0011): alpha has root SSH and a
          # root shell on the USB gadget. Dispatch Build with profile=production first.
          profile=$(cat dist/profile 2>/dev/null || echo alpha)
          test "$profile" = production || {
            echo "candidate is the $profile profile: run Build with profile=production" >&2
            exit 1
          }
          (cd dist && sha256sum -c "$stu.sha256")
          python3 os/support/stu_check.py accept "dist/$stu"
          # The tag the notes compare with, alphas sorted before their release: for an alpha
          # the newest tag, for a release the previous release, whose owners saw no alpha.
          previous=$(git -c versionsort.suffix=-alpha. tag -l 'os-v*' --sort=-v:refname |
            { if ((${#pre[@]})); then cat; else grep -v -e -alpha. || true; fi; } | head -1)
          python3 tools/release/notes.py os "$version" "$stu" \
            "$(cut -d ' ' -f 1 "dist/$stu.sha256")" $previous > dist/notes.md
          # The GPL's sources and the SBOM travel with every release that ships the binaries.
          for f in "SoundTap-Core-$version-sources.tar" "SoundTap-Core-$version.cdx.json"; do
            test -s "dist/$f" || { echo "candidate lacks $f: Build with profile=production makes it" >&2; exit 1; }
          done
          gh release create "$tag" --target "$GITHUB_SHA" --title "SoundTap Core $version" \
            --notes-file dist/notes.md --draft "${pre[@]}" \
            "dist/$stu" "dist/$stu.sha256" \
            "dist/SoundTap-Core-$version-sources.tar" "dist/SoundTap-Core-$version.cdx.json"

  app:
    needs: ci-passed
    if: inputs.lane == 'app'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci --ignore-scripts && npm run build
        working-directory: app/frontend
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod
      - name: Build and publish the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d ' \n' < app/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[1-9][0-9]*)?$ ]] ||
            { echo "app/VERSION must be X.Y.Z or X.Y.Z-alpha.N" >&2; exit 2; }
          tag=app-v$version bin=SoundTap-app-$version-armv7.bin
          pre=()
          if [[ "$version" == *-alpha.* ]]; then pre=(--prerelease); fi
          ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null ||
            { echo "$tag exists: raise app/VERSION first" >&2; exit 1; }
          python3 tools/release/changelog.py check "$tag"
          mkdir -p dist
          (cd app && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath \
            -ldflags "-s -w -X main.version=$tag" -o "../dist/$bin" ./cmd/soundtapd)
          (cd dist && sha256sum "$bin" > "$bin.sha256")
          level=$(cat app/internal/osapi/level)
          previous=$(git -c versionsort.suffix=-alpha. tag -l 'app-v*' --sort=-v:refname |
            { if ((${#pre[@]})); then cat; else grep -v -e -alpha. || true; fi; } | head -1)
          python3 tools/release/notes.py app "$version" "$bin" \
            "$(cut -d ' ' -f 1 "dist/$bin.sha256")" $previous --os-api "$level" > dist/notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "SoundTap app $version" \
            --notes-file dist/notes.md --draft "${pre[@]}" "dist/$bin" "dist/$bin.sha256"

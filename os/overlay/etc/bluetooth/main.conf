# BlueZ configuration for a SoundTap speaker.
#
# Everything BlueZ needs beyond this file it takes from its own defaults; the
# packaged main.conf is nothing but empty section headers, so replacing it costs
# no setting. Only what a speaker genuinely needs differs from the default.
#
# The Class of Device says what the speaker is. Without it the adapter reports
# 0x040000, Audio/Video with no minor class, and iOS treats the speaker as a
# headphone and sends the stream about 22 dB down whatever its volume slider says
# (measured on an ST10's source bus). BlueZ documents this key for 5.79 and uses only its major and
# minor class bits; the service bits come from the profiles registered over the
# management socket.

[General]
# Audio/Video (major 0x04), Loudspeaker (minor 0x05), with the Audio service bit.
Class = 0x240414
# Pairing is a window (ADR 0055), and bt.sh closes it. These stay 0: BlueZ's own
# discoverable timeout left the controller answering inquiries after it ran out,
# while reporting Discoverable: no.
DiscoverableTimeout = 0
PairableTimeout = 0

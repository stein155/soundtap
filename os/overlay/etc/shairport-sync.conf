// AirPlay 2 receiver config for the SoundTap-only firmware.
// shairport-sync (built --with-airplay-2 + nqptp) streams audio from Apple devices
// to ALSA's default device, which /etc/asound.conf routes into soundtapd's source bus.

general = {
	name = "SoundTap"; // soundtapd overrides this with the persisted speaker name
	service_type = "airplay2"; // fail/retry instead of silently advertising Classic if nqptp is late
	output_backend = "alsa";
	interpolation = "vernier"; // avoid soxr's floating-point cost on the ST10
	ignore_volume_control = "yes"; // soundtapd's Mixer is the sole volume control
};

// Tell soundtapd when AirPlay grabs/releases the amp so now_playing shows AIRPLAY
// and the TuneIn player (ffmpeg) stops. API is soundtapd's loopback :80 listener.
sessioncontrol = {
	run_this_before_play_begins = "/opt/soundtap/airplay-source.sh on";
	run_this_after_play_ends    = "/opt/soundtap/airplay-source.sh off";
	wait_for_completion = "yes"; // source ownership must change before PCM starts or the next session
};

alsa = {
	output_device = "default";    // → source bus → soundtapd's mixer
	output_rate = 48000;
	output_format = "S16_LE";
	output_channels = 2;
	// pcm_null has no finite maximum, so ALSA otherwise chooses a huge buffer and
	// pcm_file fails its derived allocations with ENOMEM during snd_pcm_hw_params.
	period_size = 1024;
	buffer_size = 8192;
	use_mmap_if_available = "no"; // ioplug does not support mmap
	// The null slave reports almost no delay while the bus FIFO and the Mixer hold the
	// real latency, so syncing to it made shairport correct ~2600 ppm all the time and
	// starve the Mixer in bursts (audible stutter). The FIFO already paces output at
	// the DAC rate.
	disable_synchronization = "yes";
};

// Now-playing metadata → soundtapd reads this pipe (airplay_meta.go) and shows the
// AirPlay track/artist in /api/now, like Spotify. Cover art is skipped for now.
metadata = {
	enabled = "yes";
	include_cover_art = "no";
	pipe_name = "/tmp/shairport-sync-metadata";
	pipe_timeout = 5000;
};

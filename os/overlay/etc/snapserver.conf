[server]
datadir = /run/soundtap/snapserver
# Every speaker has one core. The default adds two worker threads that only trade the same
# io_context back and forth: as leader for two followers that cost 20.7 % CPU against
# 17.1 % with the main thread alone (ST20, 2026-10-24, 40 s per-process ticks).
threads = 0
# No _snapcast._tcp announcement: speakers group by address through /api/devices (ADR 0013),
# and snapserver's Avahi client polled every 50 ms for it, about 20 wakeups a second on an
# idle speaker. A third-party snapclient connects by the speaker's address.
mdns_enabled = false

[http]
enabled = false

[tcp-control]
enabled = true
bind_to_address = 127.0.0.1
port = 1705

[tcp-streaming]
enabled = true
bind_to_address = 0.0.0.0
port = 1704

[stream]
source = pipe:///run/soundtap/snapcast.pcm?name=SoundTap&sampleformat=46875:16:2&codec=pcm&chunk_ms=20
# A follower plays a chunk buffer - latency after the server read it, and latency is the
# follower's own chain (~350 ms). At 600 that left ~250 ms for Wi-Fi: an ST20 follower
# ran short 9 times in 7 minutes, and each hard resync was ~1.5 s of silence.
buffer = 1000

[logging]
# soundtapd polls the control port every few seconds, and snapserver logs every poll:
# a notice for the connection and an error for the EOF when it closes. At the default
# *:info that filled the 512 KiB log in about 20 minutes and truncated everything else.
filter = *:warning,ControlSessionTCP:fatal
sink = stdout

# avahi-daemon config for the SoundTap firmware.
# librespot (Spotify Connect, built with-avahi) and shairport-sync (AirPlay) both advertise
# through this daemon. mDNS runs over IPv4 and IPv6 (ADR 0134): <name>.local answers with the
# speaker's A and AAAA records, on both. A stock kernel has no IPv6; avahi then logs one
# socket error at start and goes on over IPv4.
[server]
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000
# usb0 is the USB gadget: a recovery console and TAP link, never a network to announce
# on. avahi sends all interfaces through one UDP socket, and while a USB host has the
# gadget up without reading it, usb0 takes packets and never sends them. The socket's
# send buffer then fills and avahi-daemon blocks for good, which silenced mDNS on wlan0
# too: no _soundtap._tcp, no AirPlay or Spotify discovery (WLA, 2026-10-09).
deny-interfaces=usb0

[wide-area]
# As on stock: link-local mDNS only, no unicast DNS-SD through the router's DNS server.
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no
# The speaker's IPv6 addresses (AAAA) are answered over IPv4 mDNS too, so a client on a
# network that filters IPv6 multicast still learns them; its IPv4 address stays IPv4-only.
publish-aaaa-on-ipv4=yes
publish-a-on-ipv6=no

[rlimits]

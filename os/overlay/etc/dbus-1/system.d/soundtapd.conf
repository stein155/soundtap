<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  SPDX-License-Identifier: GPL-3.0-only
  SPDX-FileCopyrightText: 2026 SoundTap contributors

  soundtapd runs as its own user (ADR 0066) and asks BlueZ (pairings, its pairing agent)
  and bluealsa over the system bus, which by default answers only root there. avahi
  answers everyone already.
-->
<busconfig>
  <policy user="soundtapd">
    <allow send_destination="org.bluez"/>
    <allow send_destination="org.bluealsa"/>
    <allow send_destination="org.freedesktop.Avahi"/>
  </policy>
</busconfig>

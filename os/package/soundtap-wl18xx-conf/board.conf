# WiLink8 (WL1835MOD) board configuration of the ST10, Wireless Link and ST20, as the
# differences from TI's own default, wlconf/wl18xx-conf-default.bin in 18xx-ti-utils R8.8.
# Every element not set here keeps TI's default. Decoded once from Bose's per-region
# wl18xx-conf.bin with `wlconf -i <bin> -g`; the build turns this file plus one
# region file back into the binary with `wlconf -C`, byte-identical to what the speakers ran.
#
# Element names and units: 18xx-ti-utils wlconf/conf.h and the official_inis/*.ini comments.

# Interrupt and completion coalescing: one RX interrupt per 8 packets or 0x800 us, one TX
# completion report per 32 frames or 0x800 us (TI default: per packet, 600 us / 10, 350 us).
core.rx.irq_pkt_threshold = 0x0008
core.rx.irq_timeout = 0x0800
core.tx.tx_compl_timeout = 0x0800
core.tx.tx_compl_threshold = 0x0020

# HT mode 0: the driver's default channel widths and MIMO (TI default 1, wide channels).
wl18xx.ht.mode = 0x00

# Front end: FEM component types per band, two antennas on 5 GHz as on 2.4 GHz, and the
# phy spare byte cleared.
wl18xx.phy.spare0 = 0x00
wl18xx.phy.low_band_component_type = 0x05
wl18xx.phy.high_band_component_type = 0x0a
wl18xx.phy.number_of_assembled_ant5 = 0x02

# Fixed TX power levels for the low/medium/high power modes: 0xff = not used, the firmware
# runs its own power control.
wl18xx.phy.low_power_val = 0xff
wl18xx.phy.med_power_val = 0xff
wl18xx.phy.high_power_val = 0xff
wl18xx.phy.low_power_val_2nd = 0xff
wl18xx.phy.med_power_val_2nd = 0xff
wl18xx.phy.high_power_val_2nd = 0xff

# PCB trace loss per sub-band between the chip and the antennas, TX and RX.
wl18xx.phy.per_sub_band_tx_trace_loss = 0x08, 0x18, 0x10, 0x10, 0x10, 0x10, 0x10, 0x10, 0x10, 0x10
wl18xx.phy.per_sub_band_rx_trace_loss = 0x08, 0x18, 0x10, 0x10, 0x10, 0x10, 0x10, 0x10, 0x10, 0x10, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00

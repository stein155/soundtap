# The documentation site. Owners get the first section; everything after it is for
# contributors. The repository's front pages (README.md as the overview, CHANGELOG.md,
# RUNBOOK.md, SECURITY.md) and the landing page (index.md, docs/overrides/home.html) come in
# through docs/tools/root_pages.py, which serves docs/README.md, the documentation map, as
# documentation.md. Maintainer procedure (RELEASING.md, CONTRIBUTING.md) stays on GitHub;
# links to it leave the site. The look follows the web UI (Montserrat, black on light grey):
# docs/overrides holds the templates, docs/stylesheets/site.css the styles.
site_name: SoundTap
site_description: A second life for your Bose SoundTouch.
site_url: https://stein155.github.io/soundtap/
repo_url: https://github.com/stein155/soundtap
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  *.patch
  /tools/
  /overrides/
# Reached through their index page rather than the navigation.
not_in_nav: |
  /decisions/0*.md
  /decisions/template.md
hooks:
  - docs/tools/root_pages.py
  - docs/tools/github_links.py
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # Montserrat comes from docs/assets/fonts (site.css), never from Google Fonts.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.sections, navigation.indexes, navigation.top, search.highlight, content.action.edit, toc.follow]
extra_css:
  - stylesheets/site.css
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true, title: On this page}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  links: {not_found: warn, anchors: warn, absolute_links: info, unrecognized_links: warn}
nav:
  - Home: index.md
  - Owners:
      - owners/README.md
      - Overview: overview.md
      - Installing SoundTap: owners/install.md
      - FAQ: owners/faq.md
      - Compatibility: owners/compatibility.md
      - Runbook: runbook.md
      - Music Assistant: owners/music-assistant.md
      - API stability: owners/api-stability.md
      - Maintenance: owners/maintenance.md
      - Security: security.md
      - Changelog: changelog.md
      - Road to 1.0: owners/roadmap.md
  - Contributors:
      - contributors/README.md
      - Start here: contributors/start-here.md
      - Documentation map: documentation.md
      - Technical design: contributors/design.md
      - Decision records: decisions/README.md
      - State on the speaker: contributors/nv-state.md
      - Environment variables: contributors/environment.md
      - Reverse-engineering evidence: contributors/evidence.md
      - Test map: contributors/testing/README.md
      - Install gate: contributors/testing/install-gate.md
  - Hardware:
      - hardware/README.md
      - Hardware test: hardware/hardware-test.md
      - Install records: hardware/install-records.md
      - SoundTouch 10:
          - hardware/st10/README.md
          - Hardware contract: hardware/st10/hardware-contract.md
          - Remote control: hardware/st10/remote-control.md
          - Recovery and the ROM: hardware/st10/usb-recovery-and-rom.md
          - Boot pattern: hardware/st10/boot-splash.md
          - Stock audio path: hardware/st10/stock-audio-path.md
      - SoundTouch 20:
          - hardware/st20/README.md
          - Hardware contract: hardware/st20/hardware-contract.md
          - Mask-ROM USB recovery: hardware/st20/rom-usb-recovery.md
          - BCO network card: hardware/st20/bco-network-card.md
          - BCO recovery: hardware/st20/bco-recovery.md
          - AUX codec route: hardware/st20/aux-codec-route.md
          - Standby clock: hardware/st20/standby-clock.md
      - Wireless Link:
          - hardware/wla/README.md
          - Buttons: hardware/wla/buttons.md
          - Lamps: hardware/wla/led-behaviour.md
          - Bluetooth and analog output: hardware/wla/bluetooth-and-analog-output.md
          - Audio configuration: hardware/wla/audio-config.md
      - SoundTouch 300:
          - hardware/st300/README.md
      - Previews:
          - SoundTouch Portable: hardware/portable/README.md
          - SoundTouch SA-5: hardware/sa5/README.md
          - Lifestyle 600/650 module: hardware/ls650/README.md
          - SoundTouch adapter: hardware/lisa/README.md

      - path: ^internal/update/[^/]+\.go$
        linters:
          - bodyclose
          - contextcheck
          - err113
          - exhaustruct_v5
          - funcorder
          - gochecknoglobals
          - govet
          - lll
          - mnd
          - nestif
          - nilnil
          - noinlineerr
          - nonamedreturns
          - paralleltest
          - prealloc
          - revive
          - testpackage
          - unparam
          - varnamelen
          - wrapcheck
      # Tests may be long and repeat literals; table tests read better that way.
      - path: _test\.go
        linters: [cyclop, dupl, funlen, gocognit, goconst, nestif, gosec, forcetypeassert]
      # PCM samples are bit patterns: these conversions are the point, and the range is
      # clamped where it matters.
      - path: internal/audio/
        text: G115
      # The D-Bus wire codec converts between Go integers and their wire bit patterns,
      # and its encode/decode switches are one case per type code.
      - path: internal/dbus/
        text: G115
      - path: internal/dbus/wire\.go
        linters: [cyclop, funlen, gocognit]
      # The word tables hold every language's translations, in every script.
      - path: internal/panel/words\.go
        linters: [gosmopolitan]
      # Tests feed non-Latin text on purpose to prove the multilingual paths.
      - path: _test\.go
        linters: [gosmopolitan]
      # Keys of documents we read but do not define: the OpenAPI spec's own names and
      # librespot's credentials file.
      - path: internal/web/(openapi|types_contract)_test\.go
        linters: [tagliatelle]
      - path: internal/web/redact\.go
        linters: [tagliatelle]
        text: auth_data
      # A command's standard output is what it is run for.
      - path: cmd/
        linters: [forbidigo]
      # The API's own headers are spelled X-SoundTap-* as its documentation spells them
      # (ADR 0108); http.Header canonicalizes them on use either way.
      - linters: [canonicalheader]
        text: X-SoundTap-
      # Host-side tools write where their operator points them; that path is the input.
      - path: cmd/bcoflash/
        text: G703
issues:
  # The whole tree is judged: no cap on how many issues one linter or one text may report.
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  # gofumpt is the stricter gofmt; goimports keeps the module's own imports in their own group.
  enable: [gofmt, gofumpt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/stein155/soundtap/app]
  exclusions:
    paths:
      - frontend/

# golangci-lint v2. `make lint-go` judges the whole module with every linter on: a linter is
# configured to the project's contracts below rather than turned off. Only the linters
# golangci-lint itself marks deprecated stay off, because their successors are on.
version: "2"
linters:
  default: all
  disable:
    - exhaustruct # deprecated in v2.15; exhaustruct_v5 is its successor and is on
    - gomodguard # deprecated in v2.15; gomodguard_v2 is its successor and is on
    - wsl # deprecated in v2.15; wsl_v5 is its successor and is on
  settings:
    # Thresholds that keep functions small and plain.
    cyclop: { max-complexity: 15 }
    dupl: { threshold: 120 }
    funlen: { lines: 80, statements: 50 }
    gocognit: { min-complexity: 20 }
    nestif: { min-complexity: 5 }
    goconst:
      # JSON keys and URL schemes read better spelled out.
      ignore-string-values: ["^(name|status|error|event|source|volume|current|updatable|unavailable|http|pause|host)$"]
    # Every check of gocritic, revive and staticcheck is on too, but for the duplicates and
    # contradictions named.
    gocritic:
      enable-all: true
      disabled-checks:
        - unnamedResult # asks for named results, which nonamedreturns forbids
    revive:
      enable-all-rules: true
      rules:
        # Each of these repeats a linter above that is configured to the project's thresholds.
        - { name: add-constant, disabled: true } # mnd and goconst
        - { name: cognitive-complexity, disabled: true } # gocognit
        - { name: cyclomatic, disabled: true } # cyclop
        - { name: file-header, disabled: true } # goheader
        - { name: function-length, disabled: true } # funlen
        - { name: line-length-limit, disabled: true } # lll
        - { name: max-control-nesting, disabled: true } # nestif
        - { name: unhandled-error, disabled: true } # errcheck
        - { name: imports-blocklist, disabled: true } # depguard
        - { name: banned-characters, disabled: true } # asciicheck and bidichk
        - { name: unchecked-type-assertion, disabled: true } # forcetypeassert
        - { name: redefines-builtin-id, disabled: true } # predeclared
        - { name: empty-lines, disabled: true } # whitespace
        # Asks for named results, which nonamedreturns forbids.
        - { name: confusing-results, disabled: true }
    staticcheck:
      checks: [all]
    dupword:
      # In literals a repeated word is data: format verbs, C source, expected messages.
      comments-only: true
      # "connect to to accept", "out of it it runs": English, not a slip.
      ignore: [to, it]
    misspell:
      # Stock's MTD label "NAND.Persistant-Storage" is matched as spelled, and a test sends
      # the typo "nmae" on purpose.
      ignore-rules: [persistant, nmae]
    gosec:
      excludes:
        - G103 # unsafe: the ALSA and evdev ioctls need it
        - G204 # subprocess with arguments: the daemon drives system tools by design
        - G301 # directory permissions are set per path on the speaker
        - G304 # file paths from variables: the speaker reads its own files
        - G306 # file permissions are set per file on the speaker
    depguard:
      # The module's own packages, the standard library and the dependencies in go.mod; a new
      # dependency is added here on purpose (ADR 0124).
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - github.com/stein155/soundtap/app
            - github.com/eclipse/paho.mqtt.golang
            - github.com/godbus/dbus/v5
            - github.com/gorilla/websocket
            - golang.org/x/net/proxy
            - golang.org/x/sync/semaphore
            - golang.org/x/sys/unix
    gomodguard_v2:
      # The same list as depguard, for go.mod itself.
      allowed:
        - module: github.com/eclipse/paho.mqtt.golang
        - module: github.com/godbus/dbus/v5
        - module: github.com/gorilla/websocket
        - module: golang.org/x/net
        - module: golang.org/x/sync
        - module: golang.org/x/sys
    exhaustruct_v5:
      # Standard-library structs are designed so an unset field means its default.
      ignore-patterns:
        - '^(archive|bufio|bytes|compress|container|context|crypto|database|debug|embed|encoding|errors|expvar|flag|fmt|go|hash|html|image|io|log|maps|math|mime|net|os|path|reflect|regexp|runtime|slices|sort|strconv|strings|sync|syscall|testing|text|time|unicode|unique|unsafe)(/[^.]+)?\..+$'
    goheader:
      # Every Go file opens with the REUSE header (`make lint-reuse`).
      template: |-
        SPDX-License-Identifier: GPL-3.0-only
        SPDX-FileCopyrightText: {{ YEAR-RANGE }} SoundTap contributors
      values:
        regexp:
          YEAR-RANGE: '\d{4}(-\d{4})?'
    gosmopolitan:
      # The daemon is multilingual: translated strings in every script belong in the word
      # tables, which are excluded below; elsewhere a non-Latin literal is still reported.
      # Alarms and the clock run in the speaker's own time zone, so time.Local is the point.
      allow-time-local: true
      watch-for-scripts: [Han, Hangul, Hiragana, Katakana, Cyrillic, Greek, Arabic, Hebrew, Thai, Devanagari]
    govet:
      enable-all: true
      disable:
        # Its fix reorders struct fields and drops their comments; the field order documents
        # the wire and file formats.
        - fieldalignment
    lll:
      # Comments are wrapped at 100 columns and code stays within 120 (tabs as 4), as most of
      # the gofmt'd tree already is. A long line is split by hand: golines' automatic splits
      # wrap single arguments and are not stable under gofmt.
      line-length: 120
      tab-width: 4
    tagliatelle:
      case:
        # The HTTP API's JSON is camelCase and frozen (ADR 0108): fields are never renamed to
        # please the linter. XML tags follow the external protocols (UPnP, DIDL, Bose's API)
        # and are not checked.
        rules:
          json: camel
        # Frozen API fields that spell an initialism in capitals.
        ignored-fields: [OnDC]
        overrides:
          # Third-party JSON these packages read, spelled as the service spells it.
          - pkg: internal/update
            rules: { json: snake }
          - pkg: internal/safehttp
            rules: { json: snake }
          # os/models.json, shared with the build's Python, is snake_case.
          - pkg: internal/modeltable
            rules: { json: snake }
          # Spotify's and TuneIn's own JSON mix snake_case and camelCase in one object.
          - pkg: internal/spotify
            ignore: true
          - pkg: internal/tunein
            ignore: true
    varnamelen:
      # Go's conventional one-letter names for the parameter types every handler and test has.
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names: [err]
      ignore-decls:
        - w http.ResponseWriter
        - r *http.Request
        - t *testing.T
        - b *testing.B
        - f *testing.F
        - tb testing.TB
        - wg sync.WaitGroup
        - mu sync.Mutex
  exclusions:
    presets: [comments, std-error-handling]
    paths:
      # npm packages under the frontend may carry Go files; they are not this module's code.
      - frontend/
    rules:
      # Still to be brought up to every linter (phase 2, 2026-11): these packages may
      # not yet pass the linters listed with them. Each entry goes once its package is
      # clean; no new entry is ever added.
      - path: ^internal/artwork/[^/]+\.go$
        linters:
          - err113
          - gochecknoglobals
          - mnd
          - noinlineerr
          - paralleltest
          - revive
          - testpackage
          - varnamelen
          - wrapcheck
      - path: ^internal/bco/[^/]+\.go$
        linters:

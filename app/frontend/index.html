    <!-- Draw the app under the iOS status bar, as a native app does: without it iOS
         paints an opaque grey bar above the page that matches none of its screens.
         Every top edge already pads env(safe-area-inset-top). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Critical base layout, inline so it applies before the JS bundle and its
         stylesheet load. Without it the body briefly shows the UA margin + a window
         scrollbar, so the app jumps on refresh. Keep in sync with
         styles/tokens.css. -->
    <!-- Apply the system's colour scheme before the first paint so a dark-mode
         device never flashes the light theme. Mirrors hooks/useThemeMode.ts. -->
    <script>
      (function () {
        try {
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#121212' : '#f9f9f9');
        } catch (e) {
          /* private mode / no matchMedia: default to light */
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f9f9f9;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #121212;
      }
      /* A home-screen app: iOS reports dvh short by the safe-area insets there, 100vh is
         the whole screen (--app-h in theme/GlobalStyle.ts). */
      @media (display-mode: standalone), (display-mode: fullscreen) {
        html,
        body {
          height: 100vh;
        }
      }

      /* Launch screen: the SoundTap mark and wordmark, the mark's grille holes dimming in
         turn while the app loads. It lies over #root until the app has drawn its first
         frame, then fades out (src/lib/launchScreen.ts). The wordmark is a path, so it
         looks the same before the UI font loads. scripts/splash.py draws this picture for
         iOS and prints the wordmark; keep the sizes and colours in step with it. */
      #launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding-bottom: 48px; /* splash.py's LIFT, twice */
        box-sizing: border-box;
        background: #f9f9f9;
        color: #111111;
        fill: currentColor;
        transition: opacity 240ms ease-out;
      }
      html[data-theme='dark'] #launch {
        background: #121212;
        color: #ffffff;
      }
      #launch.launch-out {
        opacity: 0;
        pointer-events: none;
      }
      #launch svg {
        display: block;
        flex: none;
      }
      .launch-hole {
        animation: launch-wave 1.8s ease-in-out infinite;
      }
      @keyframes launch-wave {
        0%,
        50%,
        100% {
          opacity: 1;
        }
        25% {
          opacity: 0.2;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch {
          transition: none;
        }
        .launch-hole {
          animation: none;
        }
      }
    </style>

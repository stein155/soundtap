<!doctype html>

    <meta charset="utf-8" />
    <!-- No maximum-scale / user-scalable=no: blocking pinch-zoom fails WCAG 1.4.4,
         and station names on this UI are small. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SoundTap</title>
    <!-- iOS home-screen shortcut label. Overwritten at runtime with the radio's
         own name (see HomePage) so a pinned tile reads e.g. "Keuken". -->

    <meta name="theme-color" content="#f9f9f9" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS launch screen for the home-screen app: the launch skeleton below as a
         picture, shown until the page paints. soundtap.local can take seconds to
         resolve, and plain http allows no service worker to show a cached shell
         sooner. One per screen size; regenerate with scripts/splash.py. -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/440x956@3-light.png"

      href="/splash/440x956@3-dark.png"

    />

    <link

    <link

    <link

    <link

    <link

    />

    <link

    />

    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/375x667@2-dark.png"

    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Draw the app under the iOS status bar, as a native app does: without it iOS
         paints an opaque grey bar above the page that matches none of its screens.
         Every top edge already pads env(safe-area-inset-top). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Critical base layout, inline so it applies before the JS bundle and its
         stylesheet load. Without it the body briefly shows the UA margin + a window
         scrollbar, so the app jumps on refresh. Keep in sync with
         styles/tokens.css. -->
    <!-- Apply the system's colour scheme before the first paint so a dark-mode
         device never flashes the light theme. Mirrors hooks/useThemeMode.ts. -->
    <script>
      (function () {
        try {
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#121212' : '#f9f9f9');
        } catch (e) {
          /* private mode / no matchMedia: default to light */
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f9f9f9;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #121212;
      }

      /* Launch skeleton: the home page as static HTML (top bar, recently played tiles,
         music services, and the docked bars as when the speaker is in standby) so the
         first frame is the layout, not a blank screen, while the JS bundle loads. React
         replaces #root's contents on mount. Keep the shapes and colours in step with
         theme/GlobalStyle.ts, AppShell and pages/HomePage/home.css (.top, .h-row, .rail
         and .card, .svc-list, .dock); scripts/splash.py draws the same picture. */
      #root:has(.ls) {
        height: 100%;
      }
      .ls {
        --bg: #f9f9f9;
        --surface: #fff;
        --surface-2: #f0f0f0;
        --surface-3: #e5e5e5;
        --section-bar: #ebebeb;
        --sk-bar: #d9d9d9; /* a shimmer block on the section bar */
        --border: rgba(22, 24, 27, 0.07);
        --shimmer: rgba(255, 255, 255, 0.55);
        --spk-pad: max(0px, calc(env(safe-area-inset-bottom) - 16px));
        width: 100%;
        max-width: 440px; /* --shell-max */
        height: 100dvh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
        position: relative;
      }
      html[data-theme='dark'] .ls {
        --bg: #121212;
        --surface: #1c1c1e;
        --surface-2: #2a2a2c;
        --surface-3: #333333;
        --section-bar: #2a2a2c;
        --sk-bar: #3a3a3c;
        --border: rgba(238, 240, 243, 0.08);
        --shimmer: rgba(255, 255, 255, 0.06);
      }
      @media (min-width: 720px) and (min-height: 600px) {
        .ls {
          max-width: 1000px;
        }
      }
      .ls-top {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: calc(60px + env(safe-area-inset-top));
        padding: env(safe-area-inset-top) 12px 0;
        box-sizing: border-box;
        background: var(--surface);
      }
      .ls-ico {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
      }
      .ls-brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ls-bar {
        flex: none;
        display: flex;
        align-items: center;
        height: 43px;
        padding: 0 16px;
        background: var(--section-bar);
      }
      .ls-bar .ls-sk {
        background-color: var(--sk-bar);
      }
      .ls-rail {
        flex: none;
        display: flex;
        gap: 12px;
        padding: 14px 16px 18px;
        overflow: hidden;
      }
      .ls-card {
        flex: none;
        width: 140px;
        height: 179px;
      }
      .ls-list {
        flex: none;
        background: var(--surface);
      }
      .ls-row {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 68px;
        padding: 0 16px;
      }
      .ls-row + .ls-row {
        border-top: 1px solid var(--border);
      }
      .ls-dock {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
      }
      .ls-idle {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 64px;
        padding: 0 12px 0 16px;
        background: var(--surface-2);
      }
      .ls-spk {
        display: flex;
        align-items: center;
        gap: 12px;
        box-sizing: content-box;
        height: 64px;
        padding: 0 18px var(--spk-pad) 10px;
        background: var(--surface);
        box-shadow:
          0 -1px 0 rgba(22, 24, 27, 0.14),
          0 -8px 20px rgba(0, 0, 0, 0.06);
      }
      .ls-sk {
        display: block;
        background-color: var(--surface-3);
        background-image: linear-gradient(
          90deg,
          transparent 0,
          var(--shimmer) 50%,
          transparent 100%
        );
        background-size: 150% 100%;
        background-repeat: no-repeat;
        border-radius: 9px;
        animation: ls-shimmer 1.4s ease-in-out infinite;
      }
      @keyframes ls-shimmer {
        from {
          background-position: -150% 0;
        }
        to {
          background-position: 150% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ls-sk {
          animation: none;
          background-image: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static launch skeleton; see .ls styles above. Replaced by React on mount. -->
      <div class="ls" aria-hidden="true">
        <div class="ls-top">
          <span class="ls-ico">
            <span class="ls-sk" style="width: 26px; height: 20px; border-radius: 4px"></span>
          </span>
          <span class="ls-brand">
            <span class="ls-sk" style="width: 24px; height: 24px; border-radius: 50%"></span>
            <span class="ls-sk" style="width: 110px; height: 13px; border-radius: 6px"></span>
          </span>
          <span class="ls-ico">
            <span class="ls-sk" style="width: 26px; height: 20px; border-radius: 4px"></span>
          </span>
        </div>
        <div class="ls-bar">
          <span class="ls-sk" style="width: 130px; height: 12px; border-radius: 6px"></span>
        </div>
        <div class="ls-rail">
          <span class="ls-card">
            <span class="ls-sk" style="width: 140px; height: 140px; border-radius: 7px"></span>
            <span
              class="ls-sk"
              style="width: 70%; height: 12px; border-radius: 6px; margin-top: 10px"
            ></span>
            <span
              class="ls-sk"
              style="width: 45%; height: 10px; border-radius: 5px; margin-top: 6px"
            ></span>
          </span>
          <span class="ls-card">
            <span class="ls-sk" style="width: 140px; height: 140px; border-radius: 7px"></span>
            <span
              class="ls-sk"
              style="width: 40%; height: 12px; border-radius: 6px; margin-top: 10px"
            ></span>
            <span
              class="ls-sk"
              style="width: 45%; height: 10px; border-radius: 5px; margin-top: 6px"
            ></span>
          </span>
          <span class="ls-card">
            <span class="ls-sk" style="width: 140px; height: 140px; border-radius: 7px"></span>
            <span
              class="ls-sk"
              style="width: 60%; height: 12px; border-radius: 6px; margin-top: 10px"
            ></span>
            <span
              class="ls-sk"
              style="width: 45%; height: 10px; border-radius: 5px; margin-top: 6px"
            ></span>
          </span>
        </div>
        <div class="ls-bar">
          <span class="ls-sk" style="width: 120px; height: 12px; border-radius: 6px"></span>
        </div>
        <div class="ls-list">
          <div class="ls-row">
            <span class="ls-sk" style="width: 44px; height: 44px; border-radius: 7px"></span>
            <span style="flex: 1">
              <span class="ls-sk" style="width: 30%; height: 13px; border-radius: 6px"></span>
              <span
                class="ls-sk"
                style="width: 65%; height: 10px; border-radius: 5px; margin-top: 8px"
              ></span>
            </span>
            <span class="ls-sk" style="width: 10px; height: 16px; border-radius: 3px"></span>
          </div>
          <div class="ls-row">
            <span class="ls-sk" style="width: 44px; height: 44px; border-radius: 7px"></span>
            <span style="flex: 1">
              <span class="ls-sk" style="width: 30%; height: 13px; border-radius: 6px"></span>
              <span
                class="ls-sk"
                style="width: 70%; height: 10px; border-radius: 5px; margin-top: 8px"
              ></span>
            </span>
            <span class="ls-sk" style="width: 10px; height: 16px; border-radius: 3px"></span>
          </div>
        </div>
        <div class="ls-dock">
          <div class="ls-idle">
            <span class="ls-sk" style="width: 28px; height: 28px; border-radius: 50%"></span>
            <span class="ls-sk" style="width: 110px; height: 12px; border-radius: 6px"></span>
          </div>
          <div class="ls-spk">
            <span class="ls-sk" style="width: 44px; height: 44px; border-radius: 50%"></span>
            <span style="flex: 1">
              <span class="ls-sk" style="width: 90px; height: 12px; border-radius: 6px"></span>
              <span
                class="ls-sk"
                style="width: 70px; height: 10px; border-radius: 5px; margin-top: 8px"
              ></span>
            </span>
            <span class="ls-sk" style="width: 20px; height: 20px; border-radius: 4px"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
